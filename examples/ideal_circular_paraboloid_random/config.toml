[loader]
name = "default"

[loader.params]
# units = "mm"

[preprocessor]
name = "none" # none, basic, outlier 

[preprocessor.params]

[mesher]
name = "Delaunay"

[mesher.params]
max_edge_length = 9.9e9

[analyzer]
name = "fit_surface" # fit_surface, known_focal

[analyzer.params]
mesher = "Delaunay"
surface = "circular_paraboloid"
write_STLs = true
focal_length = 29.0

[aggregator]
name = "mode" # mean, rms, weighted_rms

[aggregator.params]