[loader]
name = "default"

[loader.params]
# units = "mm"

[preprocessor]
name = "none" # none, basic, outlier 

[preprocessor.params]

[mesher]
name = "B-spline"	# Delaunay

[mesher.params]
# max_edge_length = 9.9e9
polynomial_degree = 3
# smoothing_factor = 0
dx = 0.01
dy = 0.01

[analyzer]
name = "fit_surface" # fit_surface, known_focal

[analyzer.params]
surface = "circular_paraboloid"
write_STLs = true
focal_length = 29.0

[aggregator]
name = "mode" # mean, rms, weighted_rms

[aggregator.params]