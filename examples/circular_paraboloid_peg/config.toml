[loader]
name = "scaling"

[loader.params]
units = "mm"

[preprocessor]
name = "basic" # basic, known_size, outlier 

[preprocessor.params]
width = 1.85
height = 2.44

[mesher]
name = "Delaunay"	# Delaunay, B-spline

[mesher.params]
max_edge_length = 0.2
polynomial_degree = 3
# smoothing_factor = 0
dx = 0.01
dy = 0.01

[analyzer]
name = "fit_surface"

[analyzer.params]
surface = "circular_paraboloid"
write_STLs = true

[aggregator]
name = "weighted_rms" # mean, rms, weighted_rms

[aggregator.params]