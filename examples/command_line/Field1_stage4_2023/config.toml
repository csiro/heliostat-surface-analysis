[loader]
name = "default"

[loader.params]

[preprocessor]
name = "basic" # basic, none

[preprocessor.params]

[mesher]
name = "Delaunay"	# Delaunay, B-spline

[mesher.params]
max_aspect_ratio = 10
# NOTE: these are options for the B-spline mesher
# polynomial_degree = 3
# smoothing_factor = 0
# dx = 0.01
# dy = 0.01

[analyser]
name = "fixed_focal_length"

[analyser.params]
focal_length_file = "design_focal_lengths.txt"

[aggregator]
name = "weighted_rms" # mean, rms, weighted_rms

[aggregator.params]
