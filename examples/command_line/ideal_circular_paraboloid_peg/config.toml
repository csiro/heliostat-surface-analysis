[loader]
name = "scaling"

[loader.params]
units = "mm"

[preprocessor]
name = "basic" # none, basic 

[preprocessor.params]

[mesher]
name = "Delaunay"	# Delaunay, B-spline

[mesher.params]
max_aspect_ratio = 10

[analyser]
name = "fit_surface"

[analyser.params]
surface = "circular_paraboloid"

[aggregator]
name = "weighted_rms" # mean, rms, weighted_rms

[aggregator.params]