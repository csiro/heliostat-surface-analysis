[loader]
name = "scaling"

[loader.params]
units = "mm"

[preprocessor]
name = "basic"

[preprocessor.params]

[mesher]
name = "Delaunay"	# Delaunay, B-spline

[mesher.params]
max_aspect_ratio = 10

[analyser]
name = "fixed_focal_length"

[analyser.params]
max_aspect_ratio = 10
focal_length_file = "focal_lengths.txt"

[aggregator]
name = "weighted_rms" # mean, rms, weighted_rms

[aggregator.params]
