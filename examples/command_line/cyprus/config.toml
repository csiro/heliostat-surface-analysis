[loader]
name = "scaling"

[loader.params]
units = "mm"

[preprocessor]
name = "outlier"

[preprocessor.params]

[mesher]
name = "Delaunay"	# Delaunay, B-spline

[mesher.params]
max_aspect_ratio = 10

[analyser]
name = "fixed_focal_length"

[analyser.params]
max_aspect_ratio = 10
focal_length_file = "examples/cyprus/focal_lengths.txt"