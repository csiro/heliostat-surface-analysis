[loader]
name = "default"

[loader.params]
# units = "mm"

[preprocessor]
name = "none" # none, basic, outlier 

[preprocessor.params]

[mesher]
name = "B-spline"	# Delaunay, B-spline

[mesher.params]
max_aspect_ratio = 10
#
polynomial_degree = 3
# smoothing_factor = 0
dx = 0.01
dy = 0.01

[analyser]
name = "fit_surface" # fit_surface, fixed_focal_length

[analyser.params]
surface = "circular_paraboloid"
write_STLs = true
focal_length = 29.0

[aggregator]
name = "weighted_rms" # mean, rms, weighted_rms

[aggregator.params]
