[metadata]
name = heliostat-surface-analysis
version = attr: surface_analysis.__version__
author = Mike Collins, Calum Acutt, Daniel Potter
author_email = mike.collins@csiro.au
url = https://bitbucket.csiro.au/projects/HELIO/repos/heliostat-surface-analysis/browse
description = 
long_description = file: README.md
long_description_content_type = text/markdown
keywords = heliostat, slope-error
license = Currently internal CSIRO use
classifiers =
    Programming Language :: Python :: 3

[options]
packages = find:
zip_safe = True
include_package_data = True
install_requires =
    numpy >= 1.23.3
	scipy >= 1.10.1
	pandas >= 1.4.4
    matplotlib >= 3.1.2
	nlopt >= 2.7.1
	pydantic >= 2.1.1
	numpy-stl >= 2.13.1
	toml >= 0.10.2

[options.entry_points]
console_scripts = 
    heliostat_surface_analysis = surface_analysis.main:main

[options.extras_require]
notebook = jupyter>=1.0.0

[options.package_data]
example = *.txt
* = README.md