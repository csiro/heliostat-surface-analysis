[build-system]
requires = ["setuptools>=59.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heliostat-surface-analysis"
version = "0.1.0"
description = ""
authors = [
	{ name = "Daniel Potter", email = "daniel.potter@csiro.au" },
	{ name = "Mike Collins", email = "mike.collins@csiro.au" },
        { name = "Calum Acutt" }
]
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
	"numpy >= 2.1.1",
	"scipy >= 1.14.1",
	"pandas >= 2.2.3",
	"matplotlib >= 3.9.2",
	"nlopt >= 2.8.0",
	"pydantic >= 2.9.2",
	"numpy-stl >= 3.1.2",
	"toml >= 0.10.2",
	"progressbar >= 2.5",
	"openpyxl >= 3.1.5",
	"ipympl >= 0.9.4"
]

[project.optional-dependencies]
notebook = [
"jupyter >= 1.1.1",
"notebook >= 7.2.2"
]

[project.scripts]
heliostat_surface_analysis = "heliostat_surface_analysis.run:main"
