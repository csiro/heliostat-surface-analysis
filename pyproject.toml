[tool.poetry]
name = "heliostat-surface-analysis"
version = "0.1.0"
description = ""
authors = ["Mike Collins <mike.collins@csiro.au>","Daniel Potter <daniel.potter@csiro.au>","Calum Acutt"]

packages = [
    { include = "heliostat_surface_analysis", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.23.3"
scipy = "^1.10.1"
pandas = "^1.4.4"
matplotlib = "^3.1.2"
nlopt = "^2.7.1"
pydantic = "^2.1.1"
numpy-stl = "^2.13.1"
toml = "^0.10.2"

[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
notebook = "^6.5.1"

[tool.poetry.scripts]
heliostat_surface_analysis = "heliostat_surface_analysis.run:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
