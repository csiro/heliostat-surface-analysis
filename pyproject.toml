[tool.poetry]
name = "heliostat-surface-analysis"
version = "0.1.0"
description = ""
authors = ["Daniel Potter <daniel.potter@csiro.au>","Mike Collins <mike.collins@csiro.au>","Calum Acutt"]

packages = [
    { include = "heliostat_surface_analysis", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.1.1"
scipy = "^1.14.1"
pandas = "^2.2.3"
matplotlib = "^3.9.2"
nlopt = "^2.8.0"
pydantic = "^2.9.2"
numpy-stl = "^3.1.2"
toml = "^0.10.2"
progressbar = "^2.5"
openpyxl = "^3.1.5"
ipympl = "^0.9.4"

[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
notebook = "^7.2.2"

[tool.poetry.scripts]
heliostat_surface_analysis = "heliostat_surface_analysis.run:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
